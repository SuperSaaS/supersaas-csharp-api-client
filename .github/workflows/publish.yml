name: Publish

# Publishes to NuGet through Trusted Publishing, so no API key is stored here. nuget.org only accepts this
# file name for this repository: renaming it means updating the policy on the SuperSaaS NuGet account.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v2.1.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack SuperSaaS.API.Client --configuration Release --no-build --output artifacts

      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: SuperSaaS

      # Naming the package from the tag fails the push if the tag and PackageVersion disagree.
      # The .snupkg next to the .nupkg is pushed along with it.
      - name: Push
        run: dotnet nuget push "artifacts/SuperSaaS.API.Client.${TAG#v}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
