name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (net10.0 build)
        run: dotnet test --configuration Release --no-build

      - name: Test (netstandard2.0 build)
        run: dotnet test SuperSaaS.API.Tests --configuration Release -p:TestNetStandard=true

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Pack
        run: dotnet pack SuperSaaS.API.Client --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
